name: etcd-raft
language: go
protocol: raft
repository: ../../../etcd-raft

system_boundary:
  kind: protocol_library
  description: >
    Analyze the pinned standalone go.etcd.io/raft/v3 module. Public Node and
    RawNode protocol APIs, Ready processing, synchronous and asynchronous storage
    write behavior, Storage interfaces and module-provided implementations,
    membership changes, and rafttest support are inside the boundary. Real
    networking, external WAL/disk, application state machines, process
    supervision, and the full etcd server are outside.

experiment:
  kind: blind_capability
  oracle_visible_to_agents: false
  research_claim: >
    Exploratory, contract-aware, read-only analysis of seven basic test-control
    capabilities in a production consensus library without source modification
    or a human answer key.

# analyze-only 仍要求 manifest 提供命令，但 `consensus-seam analyze` 不会执行
# baseline、测试、Transformer、Reviewer 或 Verifier。
build:
  command: go test -run '^$' ./...

test:
  command: go test ./...

working_directory: .

llm:
  analyzer:
    model: deepseek-v4-flash
    thinking: enabled
    reasoning_effort: max
    max_tokens: 32768
