name: etcd-raft
language: go
protocol: raft
repository: ../../../etcd-raft

system_boundary:
  kind: protocol_library
  description: >
    Analyze the pinned standalone go.etcd.io/raft/v3 module. Public Node and
    RawNode protocol APIs, Ready processing, synchronous and asynchronous storage
    write behavior, Storage interfaces and module-provided implementations,
    membership changes, and rafttest support are inside the boundary. Real
    networking, external WAL/disk, application state machines, process
    supervision, and the full etcd server are outside.

experiment:
  kind: blind_capability
  oracle_visible_to_agents: false
  research_claim: >
    Blind analysis and low-intrusion generation of seven basic test-control
    interfaces in a production consensus library without a human answer key or
    a predeclared target-specific API shape.

# `patch` 会构建候选并执行 Reviewer，但不执行 evaluator-only 后置测试；
# 使用者先查看实际生成接口，再为独立 `repair` 阶段编写真实使用测试。
build:
  command: go test -run '^$' ./...

test:
  command: go test ./...

working_directory: .

llm:
  analyzer:
    model: deepseek-v4-flash
    thinking: enabled
    reasoning_effort: max
    max_tokens: 32768
