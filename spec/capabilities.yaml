version: 1

capabilities:
  message_capture:
    description: >
      In controlled mode, every in-boundary logical cross-node protocol message
      is retained before delivery in a test-visible MessageController. Production
      behavior is unchanged when no controller is configured.
    testing_contract:
      fixed_surface: >
        Provide MessageHandle, MessageKind, PendingMessage, MessageController,
        NewMessageController(...), Pending() []PendingMessage,
        Drop(handle MessageHandle) error, and Clear(). MessageHandle is a struct
        backed by an unexported uint64 identity, stable while pending, and invalid
        after Drop, Clear, or successful Inject.
      pending_message: >
        PendingMessage contains, in this order, Handle MessageHandle, Source using
        the target's concrete node-ID type, Target using that type, Kind
        MessageKind, and Message using a target-native typed carrier. Extra
        exported fields are allowed only when typed, meaningful, and documented;
        do not add Metadata any.
      target_specific_types: >
        NativeNodeID and TargetMessage describe type slots, not literal Go names.
        Use a concrete exported target type. For Message, prefer one native common
        message struct, then an existing common interface, then a generated typed
        variant wrapper. Do not evade typing with bare any or byte-only public data.
      controlled_cache: >
        The controller owns continuation: messages cannot bypass the cache or race
        another protocol consumer. Pending preserves controller acceptance order;
        Drop and Inject do not reorder other entries. The cache is thread-safe and
        never silently evicts or loses entries.
      scope: >
        Control logical cross-node protocol requests, responses, and one-way
        messages inside system_boundary. Exclude local ticks and timers, local
        storage or WAL work, client workload, and out-of-boundary networking.
        Expand broadcast into one pending instance per concrete target.
      request_response: >
        Cache request and response as separate instances. A response has reversed
        Source and Target and a new MessageHandle. Wrap synchronous response
        continuations or channels when necessary so the response also waits for a
        later Inject; do not orphan the original caller.
      copy_safety: >
        Copy at both producer-to-controller and controller-to-Pending boundaries.
        Pending returns fresh deep snapshots, while Inject uses the controller's
        private copy. Nested slices, maps, pointers, interfaces, and streams need
        real isolation. Independently replayable stream storage may use memory,
        temporary files, or target storage and must be released when the entry leaves.
      v0_exclusions: >
        The first version does not mutate, redirect, duplicate, or fabricate
        messages. Message selection, scheduling, retries, and assertions remain
        tester policy.
      path_pairing: >
        Capture and injection use the same end-to-end path names. Discover paths
        from source; do not assume a fixed architecture or path count. Every
        relevant public route that can be completed without changing protocol
        semantics must receive the same complete controller behavior.

  message_injection:
    description: >
      Inject(handle MessageHandle) delivers one selected MessageController entry
      through its own normal target input boundary and updates that same cache.
    testing_contract:
      fixed_surface: >
        MessageController provides Inject(handle MessageHandle) error. Provide
        ErrMessageNotPending, ErrTargetUnavailable, and ErrMessageNotAccepted so
        callers can classify errors with errors.Is.
      normal_ingress: >
        Resolve or validate the real captured target and use the normal protocol
        ingress for that message direction. Identifier arithmetic or naming alone
        is not target binding. A request must reach its request ingress; fabricating
        or completing a response is not request injection.
      completion: >
        Inject succeeds when the normal input boundary confirms acceptance. It
        does not wait for dequeue, state transition, response, commit, or quiescence.
        Queue or channel acceptance is sufficient for an asynchronous target.
      cache_effects: >
        Invalid handle, unavailable target, or explicit non-acceptance returns an
        error and preserves the entry. Confirmed acceptance removes it and
        invalidates the handle. Later protocol failure does not restore it. If the
        target cannot distinguish acceptance from timeout, report that limitation
        and never restore in a way that may duplicate delivery.
      same_path: >
        Capture and injection operate on the same controller-owned instance and
        declared end-to-end path. A standalone Step, receive method, or another
        path's cache is only an underlying primitive.

  time_control:
    description: >
      A system-level TimeController manually advances protocol time while keeping
      target timeout paths and production defaults intact.
    testing_contract:
      fixed_surface: >
        Provide TimeController, NewTimeController(...), and
        Advance(steps uint64) error. Constructor parameters use concrete target
        types and wire all controlled nodes or components.
      manual_progress: >
        In controlled mode protocol time does not progress without Advance.
        Pending, Inject, Drop, Clear, observation, and external input never advance
        time implicitly.
      step_semantics: >
        One step advances every running node by one target-defined unit.
        Advance(n) is equivalent to n calls of Advance(1); do not skip intermediate
        timers. Submit each due event through the target's normal timeout path.
      implementation_forms: >
        A target may map each step to a native logical Tick or to one increment of
        a shared virtual clock. Missing Tick or edits across several files are not
        automatically invasive when clock or timer injection preserves ordering,
        transition conditions, and production behavior.
      completion: >
        Return after time has advanced and due events have been submitted, not
        after their processing, resulting messages, state transition, or commit.
        Real Sleep without preventing autonomous time progress is incomplete.
      v0_scope: >
        The first version does not provide per-node time drift or separate node
        advancement. Paused, stopped, and crashed nodes do not receive steps.

  randomness_control:
    description: >
      A deterministic pseudorandom RandomController makes hidden, non-cryptographic
      protocol choices reproducible and observable without making them constant.
    testing_contract:
      fixed_surface: >
        Provide RandomController, RandomChoice, NewRandomController(seed int64,
        ...), and Choices() []RandomChoice. RandomChoice contains a stable semantic
        Name and a concrete target-typed Value; TargetRandomValue is a type slot,
        not a literal name.
      scope: >
        Give each controlled node or component its own controller. Control hidden
        non-cryptographic choices that affect protocol state or test timing.
        Exclude cryptography, peripheral identifiers, test-data generation, and
        choices already fully visible through another controlled interface and
        relevant only to peripheral scheduling. Use NOT_APPLICABLE when none exist.
      reproducibility: >
        The same seed and random-call order produce the same sequence. Repeated
        decisions or resets draw the next value rather than reusing one constant.
        Keep the target's legal domain and production default behavior.
      visibility: >
        Choices returns a deep-copied ordered history of final semantic values such
        as selected durations or indexes, not uninterpretable raw random bits.
        Random selection is separate from the time at which its event fires.
      v0_scope: >
        The first version does not require direct per-choice override or scripted
        trace replay; the seed controls generation and Choices records results.

  lifecycle_control:
    description: >
      A LifecycleController distinguishes temporary pause, normal stop, abrupt
      crash, and recovery through the target's own lifecycle and persistence rules.
    obligations:
      pause_resume_boundary: Identify whether one runtime can pause and resume without losing volatile state.
      normal_stop_boundary: Identify normal shutdown and the state available for a later restart.
      crash_boundary: Identify abrupt loss of the runtime without an extra protocol-state flush.
      restart_or_recovery_boundary: Identify normal recovery and construction of a new runtime where required.
      state_ownership_defined: Record only state ownership defined by the target, or use NOT_APPLICABLE.
      persistent_volatile_semantics_defined: Record only persistence semantics defined by the target, or use NOT_APPLICABLE.
    testing_contract:
      fixed_surface: >
        Provide LifecycleController, NewLifecycleController(...), and Pause(node),
        Resume(node), Stop(node), Crash(node), Restart(node), each returning error.
        Use the target's concrete node-ID type. Provide ErrLifecycleUnsupported,
        classifiable with errors.Is, for an operation that cannot be implemented
        without core semantic changes.
      pause_resume: >
        Pause retains the same runtime and volatile state but prevents message
        handling, node time progress, and protocol output. Resume continues that
        instance. Network isolation alone is not Pause.
      stop: >
        Stop uses normal shutdown and permits target-defined cleanup and persistence.
        Restart after Stop uses the target's normal post-stop state and may create
        a fresh runtime when required by the target.
      crash: >
        Crash stops activity without an extra protocol-state flush, discards the
        runtime and volatile state, and retains only state already durable under
        target semantics. Pause, graceful stop, isolation, and whole-memory
        preservation are not Crash.
      restart: >
        Record whether the node was stopped or crashed. Restart with the same
        identity and configuration through normal recovery: post-stop state after
        Stop, and pre-crash durable state with a fresh runtime after Crash. The seam
        does not implement protocol catch-up.
      controller_interaction: >
        Messages already pending in MessageController survive lifecycle changes.
        Inject to an unavailable node fails and preserves the entry. Internal
        unprocessed queues are volatile on Crash. Paused, stopped, and crashed
        nodes do not receive TimeController steps.
      change_scope: >
        Attempt all five operations. Label each implementation facade_only when it
        only wraps existing public behavior, core_hook when a narrow no-op-by-default
        seam touches core files without changing protocol semantics, or
        core_semantics_required when it would alter protocol, persistence, state
        transitions, or ordering. Core hooks are allowed and must be disclosed;
        core_semantics_required operations return ErrLifecycleUnsupported.

  observation:
    description: >
      Discover and reuse safe target-native state views; add one narrow typed
      snapshot accessor only when existing public views are insufficient.
    testing_contract:
      existing_surface: >
        Prefer existing Status, State, or typed getters. For each usable interface
        document its scope, symbol, result type, useful contents, snapshot safety,
        consistency, completion meaning, and a minimal example. Do not require a
        universal controller or state schema.
      generated_surface: >
        If a low-intrusion accessor is needed, prefer Observe() TargetState, where
        TargetState is a concrete target-specific type slot rather than a literal
        generated placeholder.
      safety: >
        Observation is thread-safe, side-effect-free, does not advance time, and
        returns a deep snapshot without mutable aliases or indefinite waiting.
        Prefer typed data over diagnostic strings.
      consistency: >
        A per-node snapshot is sufficient. Do not promise a simultaneous global freeze;
        disclose temporal inconsistency across nodes or separately read getters.

  external_input:
    description: >
      Discover and document existing ordinary application workload entrypoints;
      this capability does not generate a controller or rename target APIs.
    obligations:
      workload_entrypoint: Identify application work originating outside the protocol.
      protocol_ingress_excluded: Exclude peer-to-peer protocol message ingress.
      timer_and_internal_events_excluded: Exclude Tick, timers, callbacks, and internal events.
    testing_contract:
      workload_scope: >
        Include commands, replicated logs, transactions, ordinary reads, and
        requests to replicate membership changes. Exclude protocol messages,
        lifecycle, time, observation, applying committed results, bootstrap,
        restore, diagnostics, and administration unless the target explicitly
        defines them as normal workload.
      documentation: >
        For every public entrypoint list category, symbol, concrete input type,
        preconditions, acceptance or completion semantics, result mechanism, a
        minimal Go example, and the recommended in-process route when several exist.
      transform_scope: >
        An existing usable entrypoint is SUPPORTED and needs no target change.
        If only internal entrypoints exist, report the limitation; do not invent a
        business API merely to satisfy this discovery-only capability.

prerequisites:
  target_language:
    supported:
      - go
