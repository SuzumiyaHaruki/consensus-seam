version: 1

capabilities:
  message_capture:
    description: >
      Across the materially distinct execution paths discovered inside the system
      boundary, test code can capture protocol output before it automatically
      continues along its original path. A captured message must not continue
      automatically. Safely unimplemented paths must be reported explicitly.
    testing_contract:
      activation: >
        The target may use a constructor, test environment, or wrapper that fits
        its own architecture. The interface shape and required setup must be
        declared in the interface report; a Transport abstraction is not assumed.
      list_pending: >
        A callable entrypoint lists pending messages with at least a stable
        message ID, sender, receiver, message type, and capture order.
      clear_pending: A callable entrypoint clears the current pending messages.
      consumer_scope: >
        For every claimed path, declare whether its entrypoints are callable by
        external consumers, same-package tests, or only an internal harness. An
        internal-only helper does not prove a public test interface.
      snapshot_safety: >
        Returned pending data must not let callers accidentally mutate the
        controller's internal state through shared mutable slices, pointers, or
        nested objects. Reuse a target-native clone operation when available;
        otherwise copy the mutable parts or explicitly narrow the claim.
      store_consistency: >
        New IDs or metadata must remain consistent with every existing mutation
        path for the underlying pending messages. Do not rely on parallel stores
        staying aligned when an existing public API can mutate only one of them.
      path_coverage: >
        The Analyzer discovers materially distinct in-scope paths. The
        implementation covers every low-intrusion path it can and explicitly
        records covered and uncovered paths.
      test_support_gap: >
        A raw outbound message API is only an underlying primitive. Unless an
        existing test interface already stores captured messages and supplies
        stable control-plane IDs plus list and clear operations, additional test
        support is required and the capability is not SUPPORTED. A wrapper,
        hook, or low-intrusion combination may implement the missing behavior.

  message_injection:
    description: >
      Test code can select one previously captured legal message and deliver it
      through the recorded target's normal protocol input entrypoint. Successful
      injection consumes only the selected message and preserves sender,
      receiver, and content.
    testing_contract:
      inject: A callable entrypoint selects and delivers a pending message by stable ID.
      message_id_scope: The implementation declares whether IDs belong to a pending store, test session, node, or global scope.
      control_identity: >
        Message IDs are assigned by the test-control layer to captured message
        instances. They are not protocol-message fields and need not be derived
        from term, index, type, or payload.
      target_binding: >
        Use target-object ownership or routing that actually exists in the target.
        A target ID alone is not a target-object binding. Existing constructors,
        node collections, or test environments are allowed when documented in
        the interface report.
      delivery_boundary: >
        Injection enters the normal protocol input boundary for the declared
        path and does not mutate protocol state directly.
      success_and_consumption: >
        Report success and consume the selected record only after the declared
        input boundary has accepted it. If an asynchronous transport can silently
        drop an attempted delivery and exposes no acknowledgement, retain the
        record, expose an honest uncertain outcome, or list that path as uncovered.
      consumer_scope: >
        The interface report distinguishes externally callable, same-package,
        and internal-harness injection entrypoints. A path is covered only for
        the consumer scope that can actually call it.
      path_coverage: >
        Apply injection to every discovered in-scope path that can be supported
        without changing core semantics. Explicitly report remaining paths and
        why they are not safely implemented.

  time_control:
    description: >
      Test code can deterministically advance time observed by the protocol. It
      must not add ForceTimeout, ForceElection, or equivalent shortcuts that
      manufacture protocol outcomes directly.
    accepted_v0_forms:
      - explicit_tick
      - injectable_clock
    testing_contract:
      test_support_assessment: >
        Reuse a directly testable Tick or Clock when sufficient. Add a thin
        coordination wrapper, harness method, or hook only when multiple existing
        time paths or asynchronous completion prevent direct deterministic use.
      input_domain: >
        New control values preserve the target's existing legal domain or reject
        invalid values explicitly; a test hook must not silently create protocol
        states that the original implementation considers impossible.

  randomness_control:
    description: >
      Protocol-relevant randomness can be fixed or injected so the same initial
      state and seed produce repeatable random choices.
    testing_contract:
      test_support_assessment: >
        Reuse existing configuration when directly testable; otherwise a Config
        option, dependency-injected source, hook, or test constructor may expose
        the existing random choice without replacing its algorithm.
      input_domain: >
        Fixed values, seeds, or injected sources preserve existing validation and
        legal ranges. If the target intentionally supports a broader test-only
        domain, the interface must validate and document that domain explicitly.

  lifecycle_control:
    description: >
      Existing node stop, creation, recovery, and state-ownership semantics may
      be exposed to tests. An Agent must not invent the persistent/volatile split.
    obligations:
      stop_boundary: Identify an existing stop or pause boundary and its exact meaning.
      restart_or_recovery_boundary: Identify an existing restart or recovery path; scheduler resume is not recovery.
      state_ownership_defined: Determine whether recoverable-state ownership and boundaries are already defined.
      persistent_volatile_semantics_defined: Determine whether crash-surviving and volatile state are explicitly defined.
    testing_contract:
      test_support_assessment: >
        Test support may compose or expose existing stop, create, and recovery
        APIs, but it must not invent state ownership or persistence semantics.

  observation:
    description: >
      Expose the minimum global or node state needed for capability verification
      and later testing. Fields may remain protocol- and implementation-specific;
      v0.1 does not require a universal state schema.
    testing_contract:
      test_support_assessment: >
        Use an existing Status API directly when sufficient. A read-only wrapper
        or accessor may aggregate existing state but must not create protocol state.
      snapshot_safety: >
        A read-only result must not expose mutable aliases that let callers change
        protocol or controller state through the observation interface.

  external_input:
    description: >
      Discover existing proposal, request, transaction, or equivalent application
      workload entrypoints. v0.1 does not create new business-input APIs.
    obligations:
      workload_entrypoint: Identify application work originating outside the protocol.
      protocol_ingress_excluded: Exclude peer-to-peer protocol ingress such as Step.
      timer_and_internal_events_excluded: Exclude Tick, timers, callbacks, and internal events.

prerequisites:
  target_language:
    supported:
      - go
