version: 1

capabilities:
  message_capture:
    description: >
      On every claimed message-control path, controlled protocol output is
      retained in a test-visible cache before delivery. Delivery resumes only
      through a later test action. The target may have one or many paths; Agent 1
      discovers them from the Go source instead of assuming an architecture.
    testing_contract:
      controlled_cache: >
        The cache retains message instances until the test explicitly takes,
        drops, clears, or injects them. A one-shot result, observable channel,
        post-delivery log, or caller-created collection is only a primitive. In
        controlled mode the capture point must own continuation; a second
        consumer racing the protocol consumer is not reliable capture.
      operations: >
        Test code can enumerate target-native message content and order, take one
        selected instance and obtain its message and routing information, drop one
        selected instance, and clear the cache. Direct mutation of an exported
        collection or a bulk all-matches operation does not replace these
        exact-instance operations. Method names are target-defined.
      instance_reference: >
        A reference must either still identify the observed cache instance or be
        rejected as stale; it must never silently retarget another instance.
        Records, handles, pointers, tokens, or mutation-safe indexes are allowed.
        Permanent numeric message IDs are not required.
      path_pairing: >
        Message capture and injection use the same end-to-end path names. Each
        path spans protocol output, exclusive cache control, selected-instance
        operation, normal input, and completion. Do not split consecutive sender
        and receiver boundaries of one route. Different message families or
        handlers remain one path when transport, cache, ingress, ownership, and
        completion are shared; evidence from one route cannot prove another.
      path_coverage: >
        Implement every discovered in-scope path that can be completed without
        changing protocol semantics. One existing harness or the easiest path
        does not cover another public path. A missing cache or wrapper on a public
        path is the work to implement, not by itself a reason to leave it uncovered.
      snapshot_safety: >
        Returned snapshots must not let callers accidentally mutate cached,
        protocol, or controller state through shared mutable data. In Go, a
        by-value struct copy is not sufficient evidence when nested slices, maps,
        pointers, interfaces, channels, futures, or consumable streams remain.
        A documented non-mutation convention does not make a live alias safe.

  message_injection:
    description: >
      Test code can deliver a concrete instance selected from the message-capture
      cache through that path's normal protocol input boundary. The message and
      destination are preserved, and cache effects are explicit.
    accepted_v0_forms:
      - separated_take_and_input
      - combined_single_call
    testing_contract:
      same_path: >
        Injection operates on the same cache instance and the same declared
        message-control path as capture. A standalone input function or capture
        from a different path is only a primitive, not complete injection.
      separated_form: >
        The cache Take operation may remove and return the selected message plus
        enough routing information for a test that already owns the real target
        objects to call the documented normal input entrypoint. Later retry,
        requeue, duplication, or loss is tester policy.
      combined_form: >
        A combined single-call operation may locate the cached instance, bind or
        validate its real target, invoke normal input, and update the cache. One
        call does not imply transactional atomicity.
      cache_effects: >
        State what successful delivery, synchronous failure, and unconfirmed
        asynchronous delivery do to the selected cache entry. Different effects
        are allowed when they are truthful and explicit.
      completion_mechanism: >
        Request-response or future-based paths preserve and document their
        original completion mechanism. Capture, removal, timeout, or injection
        must not silently orphan the sender, response channel, or future.
      message_direction: >
        The selected cached instance enters the normal input boundary for its
        own direction. Completing or fabricating a response does not inject a
        cached request; a response is injection only when that response itself
        was the selected cached instance.
      tester_policy: >
        The interface supplies cache and ingress mechanics. The test chooses the
        message, schedule, retry behavior, duplication, and assertions.

  time_control:
    description: >
      Test code can deterministically advance time observed by the protocol.
      It must not manufacture election, timeout, or other protocol outcomes.
    accepted_v0_forms:
      - explicit_tick
      - injectable_clock
    testing_contract:
      protocol_relevance: >
        Count time that can affect protocol state transitions, message emission,
        or persistence. Caller-side API deadlines, metrics, logging, and purely
        informational timestamps are not protocol-time paths unless they feed
        back into protocol behavior.
      direct_use_or_thin_coordination: >
        Reuse a directly testable Tick or Clock when sufficient. Add coordination
        only when existing time paths cannot be used deterministically as exposed.
        A claimed path must not silently drop, coalesce, or indefinitely defer a
        requested advance.
      patchability: >
        The absence of Tick, dispersed wall-clock call sites, or edits across
        several files is not automatically invasive. Classify PATCHABLE when a
        clock/timer dependency can cover the protocol-relevant path while keeping
        production defaults, timer ordering, and protocol transition conditions.
        Use INVASIVE only when control requires redesigning scheduling, event
        ordering, or protocol semantics.
      input_domain: >
        New values preserve the target's legal domain or reject invalid values.

  randomness_control:
    description: >
      With the same initial state, control parameters, and test schedule,
      protocol-relevant random decisions reproduce the same sequence and the test
      can learn each selected target-native value. Values may change at every
      decision or reset; reproducibility does not require a constant value.
    testing_contract:
      protocol_relevance: >
        Count random choices that affect protocol state, message behavior,
        persistence, or scheduling decisions. Setup identifiers, addresses,
        logging values, and other non-protocol randomness are not capability
        paths.
      preserve_behavior: >
        Reuse existing configuration or expose decisions through an explicit
        choice, seed, injected source, hook, or test constructor. Do not replace
        the algorithm, and keep the production default unchanged.
      choice_visibility: >
        The test can obtain the value selected for each protocol-relevant random
        decision, either because it supplied the value or because the target
        exposes or records the draw before the test must schedule dependent work.
      scope_and_domain: >
        Document whether control is per node, instance, or shared, and preserve or
        explicitly validate the target's legal value domain.
      reproducible_assignment: >
        For the claimed scope, the same initial state, control parameters, and
        schedule make each instance receive the same sequence of choices. A shared
        seeded source is acceptable when that assignment is deterministic; it is
        incomplete only when the same declared schedule can still assign draws to
        different instances or decisions.

  lifecycle_control:
    description: >
      Test code can crash a selected logical node and restart it through the
      target's normal recovery path. Crash stops protocol activity, discards the
      volatile runtime instance, and retains only state the target had already
      made persistent. Restart reconstructs a fresh runtime from that state.
    obligations:
      stop_boundary: Identify how protocol activity stops and the volatile runtime is discarded.
      restart_or_recovery_boundary: Identify the normal recovery path that constructs a fresh runtime from retained state.
      state_ownership_defined: Record only state ownership defined by the target, or use NOT_APPLICABLE.
      persistent_volatile_semantics_defined: Record only persistence semantics defined by the target, or use NOT_APPLICABLE.
    testing_contract:
      crash_restart_cycle: >
        Both crash and restart are required, but they may be a directly usable
        composition of existing target operations. A dedicated convenience wrapper is not required.
      state_boundary: >
        Preserve target-defined durable state exactly as of the crash point and
        discard volatile protocol state. Pause/resume of the same in-memory object
        is useful but is not crash/restart. Do not invent persistence semantics.
      message_and_ordering_boundary: >
        In-flight messages already owned by the test cache remain under test
        control. Preserve any target-defined persistence-before-send ordering; the
        seam must not make output deliverable earlier than the original path.
      recovery_scope: >
        Restart only restores the node through its normal recovery entrypoint.
        Catch-up after restart is protocol behavior for the test to drive and
        observe, not behavior implemented by the seam.
      honest_semantics: >
        Do not call pause, graceful stop, network isolation, message loss, or a
        partition a crash while the old volatile runtime remains available. Do
        not claim durable recovery when the target defines no persistence boundary.

  observation:
    description: >
      Expose the minimum target-native node or global state needed by later tests;
      v0.1 does not require a universal state schema.
    testing_contract:
      minimum_complete_interface: >
        Each runtime path needs one complete snapshot-safe interface for the
        minimum state claimed. Do not add every related accessor or caller-owned
        store to the positive claim; weaker optional primitives belong in
        limitations.
      direct_use_or_accessor: >
        Reuse an existing status interface when sufficient. Otherwise a read-only
        accessor may aggregate existing state without creating protocol state.
      snapshot_safety: >
        Observation results must not expose mutable aliases into internal state.
        A Go struct copied by value still needs inspection of nested reference and
        stream fields before it can be called a safe snapshot. Documentation that
        tells callers not to mutate an aliased result is not snapshot isolation.

  external_input:
    description: >
      Discover existing application workload entrypoints such as proposals,
      requests, transactions, or membership changes. v0.1 does not create them.
    testing_contract:
      workload_scope: >
        Include application-originated proposals, reads, transactions, and
        requests to replicate membership changes. Applying an already committed
        protocol result is not new external workload ingress. Exclude diagnostics,
        barriers, snapshots, restore, bootstrap, leadership transfer, lifecycle,
        and other maintenance or administrative operations unless the target
        explicitly defines them as application workload.
    obligations:
      workload_entrypoint: Identify application work originating outside the protocol.
      protocol_ingress_excluded: Exclude peer-to-peer protocol message ingress.
      timer_and_internal_events_excluded: Exclude Tick, timers, callbacks, and internal events.

prerequisites:
  target_language:
    supported:
      - go
