version: 1

capabilities:
  message_capture:
    description: >
      Across the materially distinct execution paths discovered inside the system
      boundary, controlled protocol output is intercepted into an explicit,
      test-visible cache before it automatically continues along its original
      path. The target may have zero, one, or many such paths; their number and
      architecture must be discovered from source rather than assumed. The test
      decides when and how cached messages are processed. Safely unimplemented
      paths must be reported explicitly.
    testing_contract:
      activation: >
        Every claimed path has a target-native test control facade that activates
        or exposes capture. It may extend an existing cache, queue, constructor,
        test environment, harness, hook, or wrapper, but the facade and required
        setup must be declared in the interface report. A particular transport
        abstraction and a universal wrapper type are not assumed.
      explicit_cache: >
        A message being observable, returned once, handed through a channel, or
        stored in a queue that the claimed test consumer cannot control is not by
        itself a test cache. A complete cache is explicit control state that keeps
        captured instances until a declared test operation consumes or removes
        them, and exposes enumeration plus exact-instance remove or clear
        operations. Saying that the test could build its own slice or map outside
        the supplied interface proves an underlying primitive, not existing
        support.
      cache_visibility: >
        Test code can enumerate or inspect cached message instances, including
        enough target-native content to decide what to do and the current cache
        order. The framework does not decide which message a test should choose.
      instance_operation: >
        Test code can act on one specified cached instance and can remove or clear
        cached messages. The reference may be a target-native record, handle,
        index, pointer, token, or optional control ID; no universal ID form is
        required.
      consumer_scope: >
        For every claimed path, declare whether its entrypoints are callable by
        external consumers, same-package tests, or only an internal harness. An
        internal-only helper does not prove a public test interface.
      snapshot_safety: >
        Returned pending data must not let callers accidentally mutate the
        controller's internal state through shared mutable slices, pointers, or
        nested objects. Reuse a target-native clone operation when available;
        otherwise copy the mutable parts or explicitly narrow the claim.
      store_consistency: >
        Any new handles or metadata remain consistent with every existing mutation
        path for the underlying cache. Prefer one authoritative cache; do not rely
        on parallel stores staying aligned when a public API can mutate only one.
      path_coverage: >
        The Analyzer discovers the materially distinct in-scope paths without
        assuming how many exist. SUPPORTED requires an explicit controllable cache
        on every such path for the claimed consumer scope. One complete harness
        path does not cover another path that only returns or emits messages. The
        implementation covers every low-intrusion path it can and explicitly
        records covered and uncovered paths.
      test_support_gap: >
        A raw outbound message API, one-shot batch, channel handoff, send hook, or
        inaccessible queue is an underlying primitive. It is complete only when a
        target-provided test facade keeps controlled output from automatically
        continuing, retains it in an authoritative cache, and exposes the required
        cache operations. An existing target-native cache may remain the single
        authoritative store and be adapted rather than copied; otherwise a
        wrapper, hook, or low-intrusion combination must add the missing behavior.

  message_injection:
    description: >
      Test code can specify one previously cached legal message instance and
      deliver it through the recorded target's normal protocol input entrypoint.
      The test owns the choice and scheduling policy; the interface provides
      target-native cache and ingress operations with explicit cache effects.
    testing_contract:
      exact_instance: >
        The test can refer to and operate on one concrete cached instance using a
        target-native record, handle, index, token, pointer, or optional control
        ID. ConsensusSeam does not provide the policy for choosing that instance.
      cache_relationship: >
        The injection facade operates on the same authoritative cache used by
        message capture. An arbitrary message accepted by a normal protocol
        ingress API is only an input primitive; it is not the controlled injection
        interface unless the cache operation that selected or consumed that exact
        instance is explicit and coherent.
      operation_shape: >
        The facade may expose a cache Take followed by a target-bound input
        operation, or one combined Inject operation. Neither form nor any method
        name is globally required. Both forms must make the relationship to the
        authoritative cache explicit and state the cache effect and error behavior.
      target_binding: >
        Use target-object ownership or routing that actually exists in the target.
        A target ID alone is not a target-object binding. Existing constructors,
        node collections, or test environments are allowed when documented in
        the interface report.
      delivery_boundary: >
        Injection enters the normal protocol input boundary for the declared
        path and does not mutate protocol state directly.
      success_and_consumption: >
        A combined injection wrapper must not report confirmed success while an
        asynchronous path may silently drop the attempt. A separate take-and-step
        interface may leave retry, requeue, or deliberate loss policy to the test;
        its responsibilities must be explicit rather than hidden.
      consumer_scope: >
        The interface report distinguishes externally callable, same-package,
        and internal-harness injection entrypoints. A path is covered only for
        the consumer scope that can actually call it.
      path_coverage: >
        Discover rather than assume the number and shape of in-scope paths. Apply
        cache-linked injection to every discovered path that can be supported
        without changing core semantics. A protocol-ingress primitive on a path
        without the capture cache and facade does not make that path SUPPORTED.
        Explicitly report remaining paths and why they are not safely implemented.

  time_control:
    description: >
      Test code can deterministically advance time observed by the protocol. It
      must not add ForceTimeout, ForceElection, or equivalent shortcuts that
      manufacture protocol outcomes directly.
    accepted_v0_forms:
      - explicit_tick
      - injectable_clock
    testing_contract:
      test_support_assessment: >
        Reuse a directly testable Tick or Clock when sufficient. Add a thin
        coordination wrapper, harness method, or hook only when multiple existing
        time paths or asynchronous completion prevent direct deterministic use.
      input_domain: >
        New control values preserve the target's existing legal domain or reject
        invalid values explicitly; a test hook must not silently create protocol
        states that the original implementation considers impossible.

  randomness_control:
    description: >
      Protocol-relevant randomness can be fixed or injected so the same initial
      state and seed produce repeatable random choices.
    testing_contract:
      test_support_assessment: >
        Reuse existing configuration when directly testable; otherwise a Config
        option, dependency-injected source, hook, or test constructor may expose
        the existing random choice without replacing its algorithm.
      input_domain: >
        Fixed values, seeds, or injected sources preserve existing validation and
        legal ranges. If the target intentionally supports a broader test-only
        domain, the interface must validate and document that domain explicitly.

  lifecycle_control:
    description: >
      Test code can make a node unavailable and make it available again using an
      existing target-native pause, stop, resume, restart, reconstruction, or
      process-control boundary. The report names the actual mechanism and must not
      claim production crash fidelity unless the target defines it.
    obligations:
      stop_boundary: Identify how the node becomes unavailable and whether this is pause, graceful stop, or crash-like reconstruction.
      restart_or_recovery_boundary: Identify how availability is restored and whether the same instance resumes or a new instance is created.
      state_ownership_defined: Record target-defined recoverable-state ownership when relevant; use NOT_APPLICABLE for an availability-only mode that makes no crash claim.
      persistent_volatile_semantics_defined: Record target-defined persistent/volatile semantics when relevant; use NOT_APPLICABLE rather than inventing them for pause/resume.
    testing_contract:
      test_support_assessment: >
        The v0.1 minimum is unavailable-and-restore control with its mechanism
        stated honestly. Test support may compose existing pause, stop, create,
        resume, or restart APIs, but it must not equate pause with a production
        crash or invent state ownership and persistence semantics.

  observation:
    description: >
      Expose the minimum global or node state needed for capability verification
      and later testing. Fields may remain protocol- and implementation-specific;
      v0.1 does not require a universal state schema.
    testing_contract:
      test_support_assessment: >
        Use an existing Status API directly when sufficient. A read-only wrapper
        or accessor may aggregate existing state but must not create protocol state.
      snapshot_safety: >
        A read-only result must not expose mutable aliases that let callers change
        protocol or controller state through the observation interface.

  external_input:
    description: >
      Discover existing proposal, request, transaction, or equivalent application
      workload entrypoints. v0.1 does not create new business-input APIs.
    obligations:
      workload_entrypoint: Identify application work originating outside the protocol.
      protocol_ingress_excluded: Exclude peer-to-peer protocol ingress handlers.
      timer_and_internal_events_excluded: Exclude Tick, timers, callbacks, and internal events.

prerequisites:
  target_language:
    supported:
      - go
